<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outreach Tracker</title>
<style>
  :root {
    --bg: #0F1115;
    --surface: #171A21;
    --surface2: #1D212A;
    --border: #262B35;
    --text: #E9ECF1;
    --muted: #8B93A3;
    --teal: #34D1BF;
    --teal-dim: rgba(52,209,191,0.14);
    --amber: #F5A623;
    --amber-dim: rgba(245,166,35,0.14);
    --coral: #FF6B6B;
    --coral-dim: rgba(255,107,107,0.14);
    --green: #4ADE80;
    --green-dim: rgba(74,222,128,0.14);
    --gray-dim: rgba(139,147,163,0.14);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px 16px 60px;
  }
  #ot-root { max-width: 900px; margin: 0 auto; }
  .ot-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .ot-title { font-size:22px; font-weight:700; letter-spacing:-0.02em; margin:0 0 4px; }
  .ot-sub { color:var(--muted); font-size:13px; margin:0; }
  .ot-stats { display:flex; gap:10px; flex-wrap:wrap; }
  .ot-stat { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 14px; min-width:78px; text-align:center; position:relative; }
  .ot-stat .n { font-size:18px; font-weight:700; line-height:1.1; }
  .ot-stat .l { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; }
  .ot-stat.due .n { color:var(--amber); }
  .ot-pulse { position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 0 rgba(245,166,35,0.6); animation: ot-pulse 1.8s infinite; }
  @keyframes ot-pulse { 0%{box-shadow:0 0 0 0 rgba(245,166,35,0.5);} 70%{box-shadow:0 0 0 8px rgba(245,166,35,0);} 100%{box-shadow:0 0 0 0 rgba(245,166,35,0);} }

  .ot-form { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:20px; }
  .ot-form-row { display:grid; grid-template-columns:1.2fr 1.2fr 0.9fr 1.4fr; gap:10px; margin-bottom:10px; }
  @media (max-width:640px){ .ot-form-row { grid-template-columns:1fr 1fr; } }
  .ot-form input, .ot-form select {
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 10px; font-size:13.5px; font-family:inherit; width:100%;
  }
  .ot-form input::placeholder { color:var(--muted); }
  .ot-form input:focus, .ot-form select:focus { outline:2px solid var(--teal); outline-offset:1px; border-color:transparent; }
  .ot-add-btn { background:var(--teal); color:#0F1115; border:none; border-radius:8px; padding:9px 18px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .ot-add-btn:hover { opacity:0.9; }
  .ot-add-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .ot-add-btn:focus-visible { outline:2px solid var(--text); outline-offset:2px; }

  .ot-filters { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .ot-filter { background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:6px 13px; font-size:12.5px; cursor:pointer; }
  .ot-filter.active { background:var(--teal-dim); border-color:var(--teal); color:var(--teal); }
  .ot-filter:focus-visible { outline:2px solid var(--teal); }

  .ot-empty { text-align:center; color:var(--muted); padding:40px 20px; font-size:13.5px; border:1px dashed var(--border); border-radius:12px; }
  .ot-error { background:var(--coral-dim); border:1px solid rgba(255,107,107,0.4); color:var(--coral); border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:16px; }

  .ot-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .ot-card.flag-due { border-color:rgba(245,166,35,0.45); }
  .ot-card.flag-overdue { border-color:rgba(255,107,107,0.5); }
  .ot-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .ot-name { font-weight:700; font-size:14.5px; }
  .ot-platform { color:var(--muted); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; margin-left:8px; }
  .ot-contact { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .ot-del { background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:2px 6px; line-height:1; }
  .ot-del:hover { color:var(--coral); }

  .ot-badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px; margin-top:8px; }
  .b-notcontacted { background:var(--gray-dim); color:var(--muted); }
  .b-sent { background:var(--teal-dim); color:var(--teal); }
  .b-due { background:var(--amber-dim); color:var(--amber); }
  .b-overdue { background:var(--coral-dim); color:var(--coral); }
  .b-replied { background:var(--green-dim); color:var(--green); }
  .b-booked { background:var(--green-dim); color:var(--green); }
  .b-won { background:var(--green-dim); color:var(--green); }
  .b-dead { background:var(--gray-dim); color:var(--muted); }

  .ot-controls { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .ot-controls select { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:6px 9px; font-size:12.5px; font-family:inherit; }
  .ot-mark-sent { background:var(--surface2); border:1px solid var(--teal); color:var(--teal); border-radius:7px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .ot-mark-sent:hover { background:var(--teal-dim); }
  .ot-note { width:100%; margin-top:9px; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:7px 9px; font-size:12.5px; font-family:inherit; resize:vertical; min-height:32px; }
  .ot-loading { text-align:center; color:var(--muted); padding:30px; font-size:13px; }
</style>
</head>
<body>

<div id="ot-root">
  <div class="ot-loading" id="ot-loading">Loading your tracker…</div>
  <div id="ot-app" style="display:none;">
    <div id="ot-error-box"></div>
    <div class="ot-header">
      <div>
        <p class="ot-title">Outreach Tracker</p>
        <p class="ot-sub">Every prospect, one place — synced to Airtable</p>
      </div>
      <div class="ot-stats">
        <div class="ot-stat"><div class="n" id="stat-total">0</div><div class="l">Total</div></div>
        <div class="ot-stat"><div class="n" id="stat-sent">0</div><div class="l">Sent</div></div>
        <div class="ot-stat due" id="stat-due-wrap"><div class="n" id="stat-due">0</div><div class="l">Follow-up</div></div>
        <div class="ot-stat"><div class="n" id="stat-replied">0</div><div class="l">Replied</div></div>
      </div>
    </div>

    <div class="ot-form">
      <div class="ot-form-row">
        <input id="f-name" placeholder="Name or business" />
        <input id="f-contact" placeholder="Email or phone" />
        <select id="f-platform">
          <option>LinkedIn</option>
          <option>Facebook</option>
          <option>Email</option>
          <option>Upwork</option>
          <option>Other</option>
        </select>
        <input id="f-note" placeholder="Notes (optional)" />
      </div>
      <button class="ot-add-btn" id="ot-add">Add prospect</button>
    </div>

    <div class="ot-filters" id="ot-filters">
      <button class="ot-filter active" data-f="all">All</button>
      <button class="ot-filter" data-f="needs">Needs follow-up</button>
      <button class="ot-filter" data-f="sent">Sent</button>
      <button class="ot-filter" data-f="replied">Replied</button>
      <button class="ot-filter" data-f="dead">Dead / Won</button>
    </div>

    <div id="ot-list"></div>
  </div>
</div>

<script>
(function() {
  let leads = [];
  let filter = 'all';

  const $ = (id) => document.getElementById(id);

  function showError(msg) {
    $('ot-error-box').innerHTML = '<div class="ot-error">' + msg + '</div>';
  }
  function clearError() {
    $('ot-error-box').innerHTML = '';
  }

  async function api(path, opts) {
    const res = await fetch('/api/leads' + path, Object.assign({
      headers: { 'Content-Type': 'application/json' }
    }, opts));
    if (!res.ok) {
      const body = await res.text();
      throw new Error('Request failed (' + res.status + '): ' + body.slice(0,200));
    }
    return res.json();
  }

  function daysSince(dateStr) {
    if (!dateStr) return null;
    const then = new Date(dateStr);
    const now = new Date();
    return Math.floor((now - then) / (1000*60*60*24));
  }

  function statusInfo(lead) {
    const s = lead.status;
    if (s === 'Not Contacted' || !s) return {cls:'b-notcontacted', label:'Not contacted', flag:null};
    if (s === 'Replied') return {cls:'b-replied', label:'Replied', flag:null};
    if (s === 'Booked') return {cls:'b-booked', label:'Booked call', flag:null};
    if (s === 'Won') return {cls:'b-won', label:'Won', flag:null};
    if (s === 'Dead') return {cls:'b-dead', label:'Dead', flag:null};
    if (s === 'Sent') {
      const d = daysSince(lead.dateSent);
      if (d === null) return {cls:'b-sent', label:'Sent', flag:null};
      if (d >= 7) return {cls:'b-overdue', label:'Overdue — 2nd follow-up (' + d + 'd)', flag:'overdue'};
      if (d >= 3) return {cls:'b-due', label:'Follow-up due (' + d + 'd)', flag:'due'};
      return {cls:'b-sent', label:'Sent — waiting (' + d + 'd)', flag:null};
    }
    return {cls:'b-notcontacted', label:'—', flag:null};
  }

  async function load() {
    try {
      leads = await api('', { method: 'GET' });
      clearError();
    } catch (e) {
      showError('Could not load leads from Airtable. Check the server environment variables. (' + e.message + ')');
      leads = [];
    }
    $('ot-loading').style.display = 'none';
    $('ot-app').style.display = 'block';
    render();
  }

  async function addLead() {
    const name = $('f-name').value.trim();
    const contact = $('f-contact').value.trim();
    const platform = $('f-platform').value;
    const note = $('f-note').value.trim();
    if (!name) { $('f-name').focus(); return; }
    $('ot-add').disabled = true;
    try {
      const created = await api('', {
        method: 'POST',
        body: JSON.stringify({ name, contact, platform, notes: note })
      });
      leads.unshift(created);
      $('f-name').value=''; $('f-contact').value=''; $('f-note').value='';
      clearError();
      render();
    } catch (e) {
      showError('Could not add prospect: ' + e.message);
    } finally {
      $('ot-add').disabled = false;
    }
  }

  async function markSent(id) {
    const today = new Date().toISOString().slice(0,10);
    try {
      const updated = await api('/' + id, {
        method: 'PATCH',
        body: JSON.stringify({ status: 'Sent', dateSent: today })
      });
      leads = leads.map(l => l.id === id ? updated : l);
      render();
    } catch (e) { showError('Could not update: ' + e.message); }
  }

  async function setStatus(id, status) {
    try {
      const body = { status };
      if (status === 'Not Contacted') body.dateSent = null;
      const updated = await api('/' + id, { method: 'PATCH', body: JSON.stringify(body) });
      leads = leads.map(l => l.id === id ? updated : l);
      render();
    } catch (e) { showError('Could not update: ' + e.message); }
  }

  async function setNote(id, val) {
    try {
      const updated = await api('/' + id, { method: 'PATCH', body: JSON.stringify({ notes: val }) });
      leads = leads.map(l => l.id === id ? updated : l);
    } catch (e) { showError('Could not save note: ' + e.message); }
  }

  async function del(id) {
    try {
      await api('/' + id, { method: 'DELETE' });
      leads = leads.filter(x=>x.id!==id);
      render();
    } catch (e) { showError('Could not delete: ' + e.message); }
  }

  function matchesFilter(lead) {
    const info = statusInfo(lead);
    if (filter==='all') return true;
    if (filter==='needs') return info.flag==='due' || info.flag==='overdue';
    if (filter==='sent') return lead.status==='Sent';
    if (filter==='replied') return lead.status==='Replied' || lead.status==='Booked';
    if (filter==='dead') return lead.status==='Dead' || lead.status==='Won';
    return true;
  }

  function render() {
    const total = leads.length;
    const sent = leads.filter(l=>l.status==='Sent').length;
    const replied = leads.filter(l=>l.status==='Replied'||l.status==='Booked'||l.status==='Won').length;
    const due = leads.filter(l=>{ const i=statusInfo(l); return i.flag==='due'||i.flag==='overdue'; }).length;
    $('stat-total').textContent = total;
    $('stat-sent').textContent = sent;
    $('stat-replied').textContent = replied;
    $('stat-due-wrap').innerHTML = '<div class="n" id="stat-due">'+due+'</div><div class="l">Follow-up</div>' + (due>0 ? '<span class="ot-pulse"></span>' : '');

    const list = $('ot-list');
    const visible = leads.filter(matchesFilter);
    const rank = (l) => { const i=statusInfo(l); if(i.flag==='overdue') return 0; if(i.flag==='due') return 1; if(l.status==='Sent') return 2; if(l.status==='Not Contacted') return 3; return 4; };
    visible.sort((a,b)=> rank(a)-rank(b));

    if (visible.length===0) {
      list.innerHTML = '<div class="ot-empty">' + (leads.length===0 ? 'No prospects yet — add your first one above.' : 'Nothing matches this filter.') + '</div>';
      return;
    }

    list.innerHTML = visible.map(l => {
      const info = statusInfo(l);
      const cardFlag = info.flag==='overdue' ? 'flag-overdue' : (info.flag==='due' ? 'flag-due' : '');
      const opts = ['Not Contacted','Sent','Replied','Booked','Won','Dead'];
      const optionsHtml = opts.map(o => `<option value="${o}" ${l.status===o?'selected':''}>${o}</option>`).join('');
      return `
        <div class="ot-card ${cardFlag}">
          <div class="ot-card-top">
            <div>
              <span class="ot-name">${escapeHtml(l.name)}</span><span class="ot-platform">${escapeHtml(l.platform)}</span>
              ${l.contact ? `<div class="ot-contact">${escapeHtml(l.contact)}</div>` : ''}
            </div>
            <button class="ot-del" data-del="${l.id}" aria-label="Delete">✕</button>
          </div>
          <span class="ot-badge ${info.cls}">${info.label}</span>
          <div class="ot-controls">
            ${l.status==='Not Contacted' ? `<button class="ot-mark-sent" data-sent="${l.id}">Mark as sent today</button>` : ''}
            <select data-status="${l.id}">${optionsHtml}</select>
          </div>
          <textarea class="ot-note" data-note="${l.id}" placeholder="Notes…">${escapeHtml(l.notes||'')}</textarea>
        </div>
      `;
    }).join('');

    list.querySelectorAll('[data-sent]').forEach(b => b.onclick = () => markSent(b.getAttribute('data-sent')));
    list.querySelectorAll('[data-status]').forEach(s => s.onchange = () => setStatus(s.getAttribute('data-status'), s.value));
    list.querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(b.getAttribute('data-del')));
    list.querySelectorAll('[data-note]').forEach(t => t.onblur = () => setNote(t.getAttribute('data-note'), t.value));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  $('ot-add').onclick = addLead;
  document.querySelectorAll('.ot-filter').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.ot-filter').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.getAttribute('data-f');
      render();
    };
  });

  load();
})();
</script>
</body>
</html>
